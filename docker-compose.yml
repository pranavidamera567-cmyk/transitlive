services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: transit
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: transit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit -d transit -h 127.0.0.1"]
      interval: 3s
      retries: 15

  web:
    build: .
    ports: ["5001:5000"]   # 5001 on the host: 5000 is often taken (macOS AirPlay, other Flask apps)
    environment:
      DATABASE_URL: postgresql+psycopg2://transit:transit@db:5432/transit
      SIM_SPEED: "1"          # try 10 to fast-forward the simulated day
    depends_on:
      db: { condition: service_healthy }
